# Configuração do ZephyrLink.
# Todos os campos são opcionais; os valores abaixo são os padrões.

role: server            # server (tem o mouse/teclado) | client (controlado)
name: zephyrlink       # nome anunciado na descoberta UDP
log_level: INFO         # DEBUG | INFO | WARNING | ERROR
log_json: false         # true => logs em JSON estruturado

network:
  tcp_port: 50510
  discovery_port: 50511
  control_port: 50512   # canal de controle local (127.0.0.1) p/ o comando 'launch'
  manual_host: null     # IP do servidor; null => descoberta automática (cliente)
  heartbeat_interval: 2.0
  heartbeat_timeout: 8.0
  reconnect_delay: 3.0
  discovery_timeout: 5.0

security:
  shared_key: change-me # OBRIGATÓRIO trocar: mesma chave nas duas máquinas
  use_tls: false
  tls_cert: null        # caminho do certificado (servidor)
  tls_key: null         # caminho da chave privada (servidor)
  tls_ca: null          # CA para o cliente validar o servidor (opcional)
  allowed_hosts: []     # vazio = todos; ex.: ["192.168.1.42", "192.168.1.*"]

layout:
  # 'edge' só é usado pelo CLIENTE: indica qual borda do servidor esta
  # máquina ocupa (right=à direita do servidor, left=à esquerda, top=acima,
  # bottom=abaixo). O servidor aprende as bordas conforme os clientes
  # conectam, aceitando um cliente por borda (topologia estrela).
  edge: right           # left | right | top | bottom
  switch_margin: 1      # pixels de tolerância para considerar a borda atingida
  return_inset: 3       # afastamento da borda ao devolver o cursor
  # Fixa clientes a bordas do servidor por IP/padrão (mesma sintaxe de
  # security.allowed_hosts). Clientes sem regra pegam a primeira borda livre,
  # evitando bordas reservadas. Sem isto, a borda depende da ordem de conexão.
  client_edges:
    "192.168.1.42": right
    "192.168.1.*": left

clipboard:
  enabled: true
  poll_interval: 0.5    # segundos entre verificações
  max_bytes: 16000000   # tamanho máximo de TEXTO sincronizado (bytes UTF-8)
  files_enabled: true   # copiar/colar arquivos entre as máquinas (Windows)
  file_max_bytes: 200000000  # teto total por transferência de arquivos (bytes)

launcher:
  # Abertura remota de aplicações. Configure no CLIENTE (máquina-alvo): ele
  # define quais apps o servidor pode abrir. O servidor só envia o 'id' (e, se
  # 'accepts_args', um parâmetro validado); o comando nunca trafega. Desligado
  # por padrão.
  enabled: false
  rate_limit_per_min: 30  # teto de aberturas que ESTE cliente aceita por minuto
  audit_file: null        # opt-in: caminho de um .jsonl com as decisões; null = desligado
  apps:
    - id: notepad
      label: Bloco de Notas
      command: ["notepad.exe"]
      platform: windows   # windows | linux | macos | omitido (qualquer SO)
      # sha256: a1b2...   # opcional: confere o hash de command[0] (64 hex) antes
      #                   # de abrir. Só faz sentido quando command[0] é o próprio
      #                   # executável-alvo, não um wrapper (cmd/start/xdg-open).
    - id: calc
      label: Calculadora
      command: ["calc.exe"]
      platform: windows

    # Parâmetro validado (Fase 2). arg_kind: url | path_in_dir | enum.
    - id: navegador
      label: Navegador (URL)
      command: ["C:\\Program Files\\Mozilla Firefox\\firefox.exe"]
      platform: windows
      accepts_args: true
      arg_kind: url
      allowed_url_schemes: ["https"]
      allowed_url_hosts: ["intranet.empresa.com", "*.empresa.com"]  # vazio = qualquer

    - id: abrir-relatorio
      label: Abrir relatório
      command: ["notepad.exe"]
      platform: windows
      accepts_args: true
      arg_kind: path_in_dir
      allowed_dirs: ["C:\\Relatorios"]
      require_confirm: true   # pede confirmação na máquina-alvo antes de abrir
