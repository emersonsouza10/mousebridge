# #Windows
# =====================================================================
# Config de CLIENTE (alvo) para máquinas WINDOWS.
# Este arquivo É versionado (vai pro git), então serve de modelo pronto.
# Na máquina Windows, copie para config.yaml e ajuste a shared_key:
#     copy config.windows.yaml config.yaml
# (o config.yaml em si é ignorado pelo git — cada máquina tem o seu.)
# =====================================================================

role: client

network:
  # IP do operador (servidor). Comente para usar a descoberta automática (UDP).
  # manual_host: 192.168.10.227

  # --- keep-alive (#Windows): impede a tela de bloquear/suspender ---
  keep_awake: true         # liga o keep-alive enquanto conectado
  keep_awake_interval: 30  # dá um toque (F15) a cada N s p/ não bloquear/suspender.
                           # Deve ser MENOR que o tempo de bloqueio do Windows.

security:
  shared_key: change-me          # TROQUE pela MESMA chave das outras máquinas

# Acesso remoto (tela + controle) — já vem ligado por padrão; explícito aqui
# só para referência no #Windows.
remote_desktop:
  enabled: true                  # aceita ser visto/controlado
  allow_insecure: true           # LAN sem TLS (frames NÃO criptografados)
  require_consent: false         # sem diálogo de permissão no alvo
